name: Docker Build CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 仅验证 Docker 构建可通过（不推送镜像，不部署）
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          no-cache: true
